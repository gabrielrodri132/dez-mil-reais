<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
  #view{position:absolute;inset:0;width:100%;height:100%}
  #cap{position:absolute;left:5%;right:5%;bottom:15.5%;text-align:center;
    font:900 82px/1.08 'Inter Display','Inter',sans-serif;text-transform:uppercase;color:#fff;letter-spacing:.5px;
    -webkit-text-stroke:15px #000;paint-order:stroke fill;text-shadow:0 8px 22px rgba(0,0,0,.55);text-wrap:balance}
  #cap span{display:inline-block;margin:0 .14em}
  #cap .off{opacity:.0}
  #cap .on{color:#fff}
  #cap .cur{color:#ffd400;transform:scale(1.08)}
  #cap.U .on,#cap.U .cur{color:#ff5a5a}
  #cap.pop{animation:pop .16s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
  #tag{position:absolute;left:50%;bottom:24.6%;transform:translateX(-50%);font:900 34px 'Inter Display',sans-serif;
    color:#111;background:#fff;padding:6px 18px;border-radius:12px;border:4px solid #000;letter-spacing:2px;display:none}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
</style></head><body>
<div id="stage">
  <svg id="view" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg>
  <canvas id="grain" width="270" height="480"></canvas>
  <div id="tag"></div>
  <div id="cap"></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070c"/><stop offset="1" stop-color="#121c2b"/></linearGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3550"/><stop offset=".55" stop-color="#9a6a5c"/><stop offset="1" stop-color="#cf966a"/></linearGradient>
  <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a85e"/><stop offset="1" stop-color="#f7d7a0"/></linearGradient>
  <linearGradient id="gKitchen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c5658"/><stop offset="1" stop-color="#2e3537"/></linearGradient>
  <radialGradient id="gGold" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#c8963d"/><stop offset=".5" stop-color="#7a5320"/><stop offset="1" stop-color="#24160a"/></radialGradient>
  <radialGradient id="gLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc56b" stop-opacity=".55"/><stop offset="1" stop-color="#ffc56b" stop-opacity="0"/></radialGradient>
  <radialGradient id="gLampCold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9cc3ff" stop-opacity=".4"/><stop offset="1" stop-color="#9cc3ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gBokeh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".9"/><stop offset=".7" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gVig" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  <linearGradient id="gPuddle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a5274"/><stop offset="1" stop-color="#101a2b"/></linearGradient>
  <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2230"/><stop offset="1" stop-color="#0b0e15"/></linearGradient>
  <linearGradient id="gMarble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9dcc3"/><stop offset="1" stop-color="#b99d6e"/></linearGradient>
  <linearGradient id="gCloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d3b2"/><stop offset="1" stop-color="#f6eedc"/></linearGradient>
  <filter id="fBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
</defs></svg>
<script src="chars.js"></script>
<script src="tl.js"></script>
<script src="scenes.js"></script>
<script>
buildShots(); buildCaps();
const view = document.getElementById("view"), cap = document.getElementById("cap"), tag = document.getElementById("tag");
const gc = document.getElementById("grain").getContext("2d"), gim = gc.createImageData(270, 480);
const NAMES = { R: "RICARDO", M: "DONA VERA", U: "NÚMERO DESCONHECIDO" };
let lastKey = null;
window.renderAt = (T) => {
  view.innerHTML = frame(T);
  const c = captionHTML(T);
  cap.className = c.who || "";
  const k = c.key != null ? clamp((T - c.key) / .16) : 1;
  cap.style.transform = `scale(${(.78 + .22 * eback(k)).toFixed(3)})`;
  cap.innerHTML = c.html;
  if (c.who && NAMES[c.who] && c.html) { tag.style.display = "block"; tag.textContent = NAMES[c.who]; tag.style.background = c.who === "U" ? "#ff3b3b" : "#fff"; tag.style.color = c.who === "U" ? "#fff" : "#111"; }
  else tag.style.display = "none";
  // grain
  let seed = Math.floor(T * 30) * 9301;
  for (let i = 0; i < gim.data.length; i += 4) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; const v = seed & 255; gim.data[i] = gim.data[i + 1] = gim.data[i + 2] = v; gim.data[i + 3] = 255; }
  gc.putImageData(gim, 0, 0);
  return true;
};
window.ready = true;
</script>
</body></html>
